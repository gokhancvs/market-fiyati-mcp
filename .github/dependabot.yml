# Monthly grouped version updates after a 7-day cooldown; security updates stay immediate.
# Minor and patch updates share one PR per group, major updates arrive one by one.
# Exact pins stay exact (versioning-strategy: increase). Every PR is merged by hand after the required checks.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    versioning-strategy: increase
    commit-message:
      prefix: build
      include: scope
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']
