name: Draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable version tag on the selected main commit (e.g. v1.0.0)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  MARKET_FIYATI_MODE: offline
  MARKET_FIYATI_ENABLE_EXPERIMENTAL: 'false'
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/check.yml
  draft:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm run release:check -- "$RELEASE_TAG"
      - name: Create draft from verified tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$RELEASE_TAG" --verify-tag --draft
          --title "$RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
