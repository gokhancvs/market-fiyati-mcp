name: Publish release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
  queue: max
env:
  MARKET_FIYATI_MODE: offline
  MARKET_FIYATI_ENABLE_EXPERIMENTAL: 'false'
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm run release:check -- "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
  verify:
    needs: validate
    uses: ./.github/workflows/check.yml
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: npm run release:check -- "$RELEASE_TAG"
      - run: npm ci --ignore-scripts
      - run: npm run check
        env:
          MARKET_FIYATI_PACK_DESTINATION: ${{ runner.temp }}/npm-release
      - name: Verify independent consumer of the tested archive
        run: npm run test:consumer -- "$RUNNER_TEMP/npm-release/pack.json"
      - name: Publish and verify npm archive
        run: node scripts/publish-npm.mjs "$RUNNER_TEMP/npm-release/pack.json"
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag \
              --title "$RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md" \
              "$RUNNER_TEMP/npm-release/"*.tgz
          fi
